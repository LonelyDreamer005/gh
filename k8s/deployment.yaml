
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tstkub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-container
          image: vinay1030/fl:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
